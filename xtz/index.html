<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 设置视口，适配手机端 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部CSS样式 -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- 名片外层容器 -->
    <div class="card-container">
        <!-- 头像区域 -->
        <div class="avatar-box">
            <!-- 头像图片，可替换为自己图片地址 -->
            <img class="avatar" src="https://picsum.photos/120/120" alt="个人头像">
        </div>
        <!-- 文字信息区域 -->
        <div class="info">
            <h2 class="name">羊宸锐</h2>
            <p class="job">前端开发工程师</p>
            <div class="contact">
                <p>📧 email@example.com</p>
                <p>📱 138‑0000‑0000</p>
                <p>🏠 四川省成都市</p>
            </div>
        </div>
    </div>
</body>
</html>
