<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图书馆读者调查问卷</title>
<style>
*{box-sizing:border-box;font-family:"Microsoft Yahei",sans-serif;}
.container{width:500px;margin:30px auto;border:2px solid #f8a8d8;padding:20px;background:#fff;}
h2{text-align:center;color:#000;}
.question{margin: 15px;px 0;}
label{display:block;margin:5px 0;}
input[type="text"],select,textarea{width:300px;padding:4px;margin-top:5px;border:1px solid #999;}
textarea{width:300px;height:150px;resize:vertical;}
.btn-group{margin-top:30px;text-align:center;}
button{padding:6px 16px;margin:0 8px;cursor:pointer;}
</style>
</head>
<body>
<div class="container">
<h2>图书馆读者调查问卷</h2>
<p>为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！</p >

<div class="question">
<p>1.您的年级</p >
<label>请你选择：
<select>
<option>请你选择</option>
<option>大一</option>
<option>大二</option>
<option>大三</option>
<option>大四</option>
<option>研究生</option>
</select>
</label>
</div>

<div class="question">
<p>2.您的专业</p >
<input type="text">
</div>

<div class="question">
<p>3.对于图书馆的阅览环境</p >
<label><input type="radio" name="env">满意</label>
<label><input type="radio" name="env">基本满意</label>
<label><input type="radio" name="env">不满意 您的建议：<input type="text"></label>
</div>

<div class="question">
<p>4.您到图书馆的原因是（可多选）：</p >
<label><input type="checkbox">借阅专业图书</label>
<label><input type="checkbox">随便坐坐，翻翻书刊</label>
<label><input type="checkbox">借阅光盘</label>
<label><input type="checkbox">参加图书馆组织的活动</label>
<label><input type="checkbox">自习，复习功课</label>
<label><input type="checkbox">上网</label>
<label><input type="checkbox">检索电子文献</label>
</div>

<div class="question">
<p>5.您到图书馆的频率</p >
<label><input type="radio" name="freq">几乎每天</label>
<label><input type="radio" name="freq">每周1-2次</label>
<label><input type="radio" name="freq">每月1-2次</label>
<label><input type="radio" name="freq">几乎不去</label>
</div>

<div class="question">
<p>6.您对学校的建议</p >

<textarea>请您提出宝贵建议：</textarea>
</div>

<div class="btn-group">
<button>提交答案</button>
<button type="reset">清 空</button>
</div>
</div>
</body>
</html>
